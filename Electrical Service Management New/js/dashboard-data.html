<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Dashboard Details | Shree Electrical Service
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }


        body {

            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #f4f7fb,
                    #edf4ff
                );

            color: #172033;

        }


        /* =====================================
           NAVBAR
        ===================================== */

        .navbar-custom {

            min-height: 70px;

            background:
                linear-gradient(
                    135deg,
                    #061b46,
                    #0047a8,
                    #0d6efd
                );

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.15);

        }


        .brand {

            color: white;

            text-decoration: none;

            font-size: 19px;

            font-weight: 800;

        }


        .brand:hover {

            color: #ffc107;

        }


        /* =====================================
           HERO
        ===================================== */

        .hero {

            position: relative;

            overflow: hidden;

            color: white;

            padding:
                45px 20px
                85px;

            background:
                linear-gradient(
                    135deg,
                    #061b46,
                    #0047a8,
                    #0d6efd
                );

        }


        .hero-icon {

            width: 65px;

            height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 15px;

            border-radius: 18px;

            color: #ffc107;

            background:
                rgba(255,255,255,.12);

            border:
                2px solid
                rgba(255,193,7,.6);

            font-size: 30px;

        }


        .hero h1 {

            margin: 0;

            font-size: 34px;

            font-weight: 800;

        }


        .hero p {

            margin-top: 8px;

            color: #dce9ff;

        }


        /* =====================================
           MAIN CARD
        ===================================== */

        .main-container {

            position: relative;

            z-index: 10;

            margin-top: -55px;

            padding-bottom: 60px;

        }


        .main-card {

            overflow: hidden;

            background: white;

            border-radius: 22px;

            box-shadow:
                0 20px 55px
                rgba(0,0,0,.10);

        }


        /* =====================================
           TOOLBAR
        ===================================== */

        .toolbar {

            padding: 22px;

            border-bottom:
                1px solid #edf0f5;

        }


        .search-box {

            position: relative;

        }


        .search-box i {

            position: absolute;

            left: 16px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #0d6efd;

        }


        .search-box input {

            height: 48px;

            padding-left: 45px;

            border-radius: 12px;

        }


        .filter {

            height: 48px;

            border-radius: 12px;

        }


        /* =====================================
           SUMMARY
        ===================================== */

        .summary {

            padding: 20px 22px;

            background: #f8faff;

            border-bottom:
                1px solid #edf0f5;

        }


        .summary-card {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .summary-icon {

            width: 44px;

            height: 44px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            color: #0d6efd;

            background: #eaf2ff;

        }


        .summary-label {

            color: #8993a5;

            font-size: 10px;

            font-weight: 700;

        }


        .summary-value {

            font-size: 18px;

            font-weight: 800;

        }


        /* =====================================
           TABLE
        ===================================== */

        .table-area {

            padding: 20px;

        }


        .table-responsive {

            overflow-x: auto;

            border-radius: 14px;

        }


        table {

            margin-bottom: 0 !important;

            white-space: nowrap;

        }


        thead th {

            padding: 15px !important;

            color: white !important;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #0047a8
                ) !important;

            border: none !important;

            font-size: 12px;

        }


        tbody td {

            padding: 14px !important;

            vertical-align: middle;

            border-color: #edf0f5 !important;

            font-size: 12px;

        }


        tbody tr:hover {

            background: #f5f9ff;

        }


        /* =====================================
           SERVICES
        ===================================== */

        .service-badge {

            display: inline-block;

            margin: 2px;

            padding:
                5px 9px;

            color: #0d6efd;

            background: #edf4ff;

            border-radius: 8px;

            font-size: 10px;

            font-weight: 600;

        }


        /* =====================================
           STATUS
        ===================================== */

        .status {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding:
                6px 11px;

            border-radius: 20px;

            font-size: 10px;

            font-weight: 700;

        }


        .paid {

            color: #198754;

            background: #dff6e8;

        }


        .pending {

            color: #9b6800;

            background: #fff1c7;

        }


        .cancelled {

            color: #842029;

            background: #f8d7da;

        }


        /* =====================================
           AMOUNT
        ===================================== */

        .amount {

            color: #198754;

            font-weight: 800;

        }


        .pending-amount {

            color: #c78300;

            font-weight: 800;

        }


        /* =====================================
           CUSTOMER BUTTON
        ===================================== */

        .customer-btn {

            padding: 0;

            border: none;

            color: #0d6efd;

            background: transparent;

            font-weight: 700;

        }


        .customer-btn:hover {

            text-decoration: underline;

        }


        /* =====================================
           LOADING
        ===================================== */

        .loading {

            padding: 70px 20px;

            text-align: center;

            color: #8993a5;

        }


        /* =====================================
           EMPTY
        ===================================== */

        .empty {

            padding: 70px 20px;

            text-align: center;

            color: #8993a5;

        }


        .empty i {

            font-size: 55px;

        }


        /* =====================================
           MODAL
        ===================================== */

        .modal-content {

            overflow: hidden;

            border: none;

            border-radius: 22px;

            box-shadow:
                0 25px 80px
                rgba(0,0,0,.25);

        }


        .modal-header-custom {

            padding: 25px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #0047a8
                );

        }


        .info-card {

            height: 100%;

            padding: 14px;

            border:
                1px solid #e8edf4;

            border-radius: 13px;

            background: #f8faff;

        }


        .info-label {

            margin-bottom: 5px;

            color: #8993a5;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;

        }


        .info-value {

            color: #172033;

            font-size: 14px;

            font-weight: 600;

            word-break: break-word;

        }


        .order-box {

            margin-bottom: 15px;

            padding: 16px;

            border:
                1px solid #e8edf4;

            border-radius: 14px;

        }


        .total-box {

            padding: 20px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #edf6ff,
                    #e8f8ef
                );

        }


        .total-box strong {

            color: #198754;

            font-size: 25px;

        }


        @media(max-width:768px) {

            .hero h1 {

                font-size: 27px;

            }

            .main-container {

                margin-top: -40px;

            }

            .table-area {

                padding: 10px;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-custom">

    <div class="container-fluid px-4">

        <a
            href="dashboard.html"
            class="brand">

            ⚡ Shree Electrical Service

        </a>


        <div class="d-flex gap-2">

            <a
                href="dashboard.html"
                class="btn btn-outline-light">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>


            <a
                href="history.html"
                class="btn btn-warning">

                <i class="bi bi-clock-history"></i>

                History

            </a>

        </div>

    </div>

</nav>



<!-- ==========================================
     HERO
========================================== -->

<section class="hero">

    <div class="container">

        <div class="hero-icon">

            <i
                id="pageIcon"
                class="bi bi-grid">
            </i>

        </div>


        <h1 id="pageTitle">

            Dashboard Details

        </h1>


        <p id="pageDescription">

            View your business information.

        </p>

    </div>

</section>



<!-- ==========================================
     MAIN
========================================== -->

<div class="container main-container">

    <div class="main-card">


        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="row g-3">

                <div class="col-lg-6">

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input
                            id="searchInput"
                            type="text"
                            class="form-control"
                            placeholder="Search...">

                    </div>

                </div>


                <div class="col-lg-3">

                    <select
                        id="statusFilter"
                        class="form-select filter">

                        <option value="">
                            All Status
                        </option>

                        <option value="paid">
                            Paid
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                    </select>

                </div>


                <div class="col-lg-3">

                    <a
                        href="dashboard.html"
                        class="btn btn-primary w-100"
                        style="height:48px;padding-top:12px">

                        <i class="bi bi-arrow-left"></i>

                        Back to Dashboard

                    </a>

                </div>

            </div>

        </div>



        <!-- SUMMARY -->

        <div class="summary">

            <div class="row g-4">


                <div class="col-md-4">

                    <div class="summary-card">

                        <div class="summary-icon">

                            <i class="bi bi-database-fill"></i>

                        </div>

                        <div>

                            <div class="summary-label">

                                RECORDS

                            </div>

                            <div
                                id="recordCount"
                                class="summary-value">

                                0

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="summary-card">

                        <div class="summary-icon">

                            <i class="bi bi-currency-rupee"></i>

                        </div>

                        <div>

                            <div class="summary-label">

                                TOTAL VALUE

                            </div>

                            <div
                                id="displayValue"
                                class="summary-value">

                                ₹0.00

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="summary-card">

                        <div class="summary-icon">

                            <i class="bi bi-clock-history"></i>

                        </div>

                        <div>

                            <div class="summary-label">

                                LAST UPDATED

                            </div>

                            <div
                                id="lastUpdated"
                                class="summary-value">

                                -

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- TABLE -->

        <div class="table-area">

            <div id="tableContainer">

                <div class="loading">

                    <div
                        class="spinner-border text-primary">
                    </div>

                    <div class="mt-3">

                        Loading data...

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>



<!-- ==========================================
     DETAILS MODAL
========================================== -->

<div
    class="modal fade"
    id="detailsModal"
    tabindex="-1">

    <div
        class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">

        <div class="modal-content">


            <div class="modal-header-custom">

                <div>

                    <h4
                        id="modalTitle"
                        class="mb-1">

                        Details

                    </h4>


                    <div id="modalSubtitle">

                        Information

                    </div>

                </div>


                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div
                id="modalContent"
                class="modal-body p-4">

            </div>


            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Close

                </button>

            </div>

        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Dashboard Data JS -->

<script
    type="module"
    src="js/dashboard-data.js">
</script>


</body>

</html>
