<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Shree Electrical Service</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;font-family:'Poppins',Arial,sans-serif;background:#f4f7fb;color:#172033}
.topbar{background:linear-gradient(135deg,#071d49,#003c8f 55%,#0d6efd);border-bottom:3px solid #ffc107;padding:12px 0;color:#fff}
.topbar .brand{color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.topbar .brand span{color:#ffc107}
.hero{background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 4px 18px rgba(0,0,0,.07);margin:22px 0}
.stat{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.07);text-align:center;height:100%}
.stat i{font-size:26px}.stat .v{font-size:22px;font-weight:700}.stat .l{font-size:12px;color:#6b7686}
.filters{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin:20px 0 14px}
.order{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);border-left:5px solid #0d6efd}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.inv{font-weight:700;font-size:16px}
.order table{font-size:13px}.order th{background:#f3f6fb}
.order-foot{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:flex-end;font-size:14px;border-top:1px dashed #d8e0ec;padding-top:10px}
.empty{background:#fff;border-radius:14px;padding:40px;text-align:center;color:#6b7686}
.empty i{font-size:42px}
</style>
</head>
<body>
<div class="topbar">
  <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
    <a class="brand" href="index.html"><i class="bi bi-lightning-charge-fill text-warning"></i> Shree <span>Electrical Service</span></a>
    <div>
      <a href="customer.html" class="btn btn-warning btn-sm fw-bold"><i class="bi bi-plus-circle"></i> New Order</a>
      <button id="logoutBtn" class="btn btn-danger btn-sm fw-bold"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="loader" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">Loading your orders...</p></div>

  <div id="content" class="d-none">
    <div class="hero d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1">Hello, <span id="welcome"></span> 👋</h4>
        <div class="text-muted small"><i class="bi bi-person"></i> <span id="uName"></span> &nbsp;|&nbsp; <i class="bi bi-phone"></i> <span id="uMobile"></span></div>
      </div>
      <span class="badge bg-primary fs-6">My Dashboard</span>
    </div>

    <div class="row g-3">
      <div class="col-6 col-md-3"><div class="stat"><i class="bi bi-receipt text-primary"></i><div class="v" id="stOrders">0</div><div class="l">Total Orders</div></div></div>
      <div class="col-6 col-md-3"><div class="stat"><i class="bi bi-wallet2 text-secondary"></i><div class="v" id="stBilled">₹0</div><div class="l">Total Billed</div></div></div>
      <div class="col-6 col-md-3"><div class="stat"><i class="bi bi-check-circle text-success"></i><div class="v" id="stPaid">₹0</div><div class="l">Paid</div></div></div>
      <div class="col-6 col-md-3"><div class="stat"><i class="bi bi-hourglass-split text-danger"></i><div class="v" id="stDue">₹0</div><div class="l">Pending</div></div></div>
    </div>

    <div class="filters row g-2 mx-0 align-items-center">
      <div class="col-12 col-md-4"><input id="fSearch" class="form-control" placeholder="Search invoice or service..."></div>
      <div class="col-6 col-md-3">
        <select id="fStatus" class="form-select">
          <option value="all">All Payments</option><option value="paid">Paid</option>
          <option value="pending">Pending</option><option value="partial">Partially Paid</option>
        </select></div>
      <div class="col-6 col-md-3">
        <select id="fMethod" class="form-select">
          <option value="all">All Payment Types</option><option value="cash">Cash</option><option value="online">Online / UPI</option>
        </select></div>
      <div class="col-12 col-md-2 text-md-end text-muted small" id="count"></div>
    </div>

    <h6 class="fw-bold mb-3"><i class="bi bi-clock-history text-primary"></i> Order History</h6>
    <div id="orders"></div>
  </div>
</div>
<script type="module" src="js/user-dashboard.js"></script>
</body>
</html>
