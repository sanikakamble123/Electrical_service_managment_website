<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | Shree Electrical Service</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;font-family:'Poppins',Arial,sans-serif;color:#172033;
background:radial-gradient(circle at 10% 20%,rgba(13,110,253,.15),transparent 30%),radial-gradient(circle at 90% 80%,rgba(255,193,7,.13),transparent 30%),#f4f7fb}
.topbar{background:linear-gradient(135deg,#071d49,#003c8f 55%,#0d6efd);border-bottom:3px solid #ffc107;padding:14px 0}
.topbar a.brand{color:#fff;text-decoration:none;font-weight:700;font-size:19px}
.topbar a.brand span{color:#ffc107}
.home-btn{background:#ffc107;color:#172033;border-radius:10px;padding:8px 18px;font-weight:700;text-decoration:none}
.card-box{max-width:440px;margin:40px auto;background:#fff;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.12);overflow:hidden}
.tabs{display:flex}
.tabs button{flex:1;border:0;padding:15px;font-weight:700;background:#eef3fb;color:#5b6678}
.tabs button.active{background:#0d6efd;color:#fff}
.body{padding:26px}
.btn-main{background:#198754;color:#fff;font-weight:700;border:0;border-radius:10px;padding:11px;width:100%}
.btn-main:hover{background:#157347;color:#fff}
.form-control{border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="brand" href="index.html"><i class="bi bi-lightning-charge-fill text-warning"></i> Shree <span>Electrical Service</span></a>
    <a class="home-btn" href="index.html"><i class="bi bi-house"></i> Home</a>
  </div>
</div>

<div class="card-box">
  <div class="tabs">
    <button id="tabLogin" class="active" type="button"><i class="bi bi-box-arrow-in-right"></i> Login</button>
    <button id="tabRegister" type="button"><i class="bi bi-person-plus"></i> Register</button>
  </div>
  <div class="body">
    <div id="msgBox" class="d-none"></div>

    <form id="loginForm" novalidate>
      <h5 class="fw-bold mb-3">Customer Login</h5>
      <label class="form-label small fw-semibold">Mobile Number</label>
      <input id="loginMobile" class="form-control mb-3" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number" autocomplete="username">
      <label class="form-label small fw-semibold">Password</label>
      <div class="input-group mb-4">
        <input id="loginPassword" type="password" class="form-control" placeholder="Your password" autocomplete="current-password">
        <button class="btn btn-outline-secondary" type="button" data-eye="loginPassword"><i class="bi bi-eye"></i></button>
      </div>
      <button id="loginBtn" class="btn-main" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i> Login to My Dashboard</button>
    </form>

    <form id="registerForm" class="d-none" novalidate>
      <h5 class="fw-bold mb-3">Create Customer Account</h5>
      <label class="form-label small fw-semibold">Full Name</label>
      <input id="regName" class="form-control mb-3" placeholder="Your full name" autocomplete="name">
      <label class="form-label small fw-semibold">Mobile Number</label>
      <input id="regMobile" class="form-control mb-3" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number" autocomplete="username">
      <label class="form-label small fw-semibold">Password (min 6 characters)</label>
      <div class="input-group mb-3">
        <input id="regPassword" type="password" class="form-control" autocomplete="new-password">
        <button class="btn btn-outline-secondary" type="button" data-eye="regPassword"><i class="bi bi-eye"></i></button>
      </div>
      <label class="form-label small fw-semibold">Confirm Password</label>
      <input id="regConfirm" type="password" class="form-control mb-4" autocomplete="new-password">
      <button id="registerBtn" class="btn-main" type="submit"><i class="bi bi-person-plus me-1"></i> Create Account</button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">Owner? <a href="login.html">Owner Login</a></p>
  </div>
</div>
<script type="module" src="js/user-auth.js"></script>
</body>
</html>
