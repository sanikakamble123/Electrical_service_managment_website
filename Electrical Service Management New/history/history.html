
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order History | Shree Electrical Service</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">


    <style>

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f7fb;
        }


        /* ================= NAVBAR ================= */

        .history-navbar {
            background: linear-gradient(135deg, #0d6efd, #003c8f);
            padding: 13px 0;
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: 700;
        }

        .navbar-brand span {
            color: #ffc107;
        }

        .navbar-actions {
            display: flex;
            gap: 10px;
        }

        .navbar-actions .btn {
            border-radius: 25px;
            font-weight: 600;
            padding: 9px 18px;
        }


        /* ================= PAGE HEADER ================= */

        .history-header {
            background: linear-gradient(135deg, #0d6efd, #003c8f);
            color: white;
            padding: 45px 20px 75px;
            position: relative;
            overflow: hidden;
        }

        .history-header::after {
            content: "⚡";
            position: absolute;
            right: 8%;
            top: -40px;
            font-size: 180px;
            opacity: .05;
        }

        .header-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: rgba(255, 193, 7, .15);
            border: 2px solid #ffc107;
            color: #ffc107;
            font-size: 30px;
        }

        .history-header h1 {
            font-weight: 800;
            font-size: 38px;
        }

        .history-header p {
            color: #dbe7f8;
            margin-bottom: 0;
        }


        /* ================= MAIN CARD ================= */

        .history-container {
            margin-top: -45px;
            position: relative;
            z-index: 2;
        }

        .history-card {
            border: none;
            border-radius: 22px;
            overflow: hidden;
            background: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .10);
        }


        /* ================= CARD HEADER ================= */

        .history-card-header {
            padding: 22px 25px;
            background: white;
            border-bottom: 1px solid #edf0f5;
        }

        .history-card-header h4 {
            margin: 0;
            font-weight: 700;
            color: #172033;
        }

        .history-card-header p {
            margin: 5px 0 0;
            color: #6c757d;
            font-size: 14px;
        }


        /* ================= FILTERS ================= */

        .filters {
            padding: 20px 25px;
            background: #f8faff;
            border-bottom: 1px solid #edf0f5;
        }

        .filter-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #667085;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            min-height: 45px;
            border-radius: 11px;
            border: 1px solid #d8dee9;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, .10);
        }

        .refresh-btn {
            min-height: 45px;
            border-radius: 11px;
            font-weight: 600;
            width: 100%;
        }


        /* ================= TABLE ================= */

        .table-section {
            padding: 20px 25px 30px;
        }

        .table-responsive {
            border-radius: 15px;
        }

        .history-table {
            margin-bottom: 0;
            vertical-align: middle;
            white-space: nowrap;
        }

        .history-table thead th {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 15px 13px;
            font-size: 14px;
            font-weight: 600;
        }

        .history-table thead th:first-child {
            border-radius: 12px 0 0 12px;
        }

        .history-table thead th:last-child {
            border-radius: 0 12px 12px 0;
        }

        .history-table tbody td {
            padding: 14px 13px;
            border-color: #edf0f5;
            font-size: 14px;
        }

        .history-table tbody tr {
            transition: .25s;
        }

        .history-table tbody tr:hover {
            background: #f5f9ff;
        }


        /* ================= STATUS ================= */

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }


        /* ================= AMOUNT ================= */

        .amount {
            font-weight: 700;
            color: #0d6efd;
        }


        /* ================= ACTION BUTTONS ================= */

        .action-btn {
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            margin: 2px;
        }


        /* ================= EMPTY TABLE ================= */

        #historyTable td[colspan] {
            padding: 50px 20px;
            color: #98a2b3;
        }

        .empty-icon {
            font-size: 40px;
            color: #c5ccd7;
            display: block;
            margin-bottom: 10px;
        }


        /* ================= FOOTER ================= */

        .history-footer {
            text-align: center;
            color: #98a2b3;
            font-size: 13px;
            padding: 25px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .history-header {
                padding: 35px 15px 65px;
            }

            .history-header h1 {
                font-size: 29px;
            }

            .navbar-brand {
                font-size: 17px;
            }

            .navbar-actions {
                margin-top: 10px;
                width: 100%;
            }

            .navbar-actions .btn {
                flex: 1;
            }

            .history-container {
                margin-top: -35px;
            }

            .history-card-header {
                padding: 18px;
            }

            .filters {
                padding: 18px;
            }

            .table-section {
                padding: 15px;
            }

        }


        @media (max-width: 576px) {

            .history-header h1 {
                font-size: 25px;
            }

            .header-icon {
                width: 55px;
                height: 55px;
                font-size: 25px;
            }

            .navbar-actions {
                gap: 5px;
            }

            .navbar-actions .btn {
                padding: 8px 12px;
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark history-navbar shadow sticky-top">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                ⚡ Shree <span>Electrical Service</span>

            </a>


            <div class="navbar-actions">

                <a href="dashboard.html"
                    class="btn btn-warning">

                    <i class="bi bi-speedometer2"></i>
                    Dashboard

                </a>


                <button class="btn btn-danger"
                    id="logoutBtn">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </button>

            </div>

        </div>

    </nav>



    <!-- ================= HEADER ================= -->

    <section class="history-header text-center">

        <div class="container">

            <div class="header-icon">

                <i class="bi bi-clock-history"></i>

            </div>

            <h1>
                Order History
            </h1>

            <p>
                View, search and manage previous electrical service orders
            </p>

        </div>

    </section>



    <!-- ================= MAIN ================= -->

    <div class="container history-container pb-4">

        <div class="history-card">


            <!-- Card Header -->

            <div class="history-card-header">

                <h4>

                    <i class="bi bi-receipt text-primary"></i>

                    Previous Orders

                </h4>

                <p>
                    Search and filter customer orders below.
                </p>

            </div>



            <!-- ================= FILTERS ================= -->

            <div class="filters">

                <div class="row g-3 align-items-end">


                    <!-- Search -->

                    <div class="col-lg-5 col-md-6">

                        <label class="filter-label">
                            SEARCH CUSTOMER
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-white">
                                <i class="bi bi-search text-primary"></i>
                            </span>

                            <input type="text"
                                id="searchBox"
                                class="form-control"
                                placeholder="Customer name or mobile">

                        </div>

                    </div>


                    <!-- Status -->

                    <div class="col-lg-3 col-md-6">

                        <label class="filter-label">
                            PAYMENT STATUS
                        </label>

                        <select id="statusFilter"
                            class="form-select">

                            <option value="">
                                All Payments
                            </option>

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="Success">
                                Success
                            </option>

                        </select>

                    </div>


                    <!-- Date -->

                    <div class="col-lg-2 col-md-6">

                        <label class="filter-label">
                            DATE
                        </label>

                        <input type="date"
                            id="dateFilter"
                            class="form-control">

                    </div>


                    <!-- Refresh -->

                    <div class="col-lg-2 col-md-6">

                        <button
                            class="btn btn-primary refresh-btn"
                            id="refreshBtn">

                            <i class="bi bi-arrow-clockwise"></i>
                            Refresh

                        </button>

                    </div>

                </div>

            </div>



            <!-- ================= TABLE ================= -->

            <div class="table-section">

                <div class="table-responsive">

                    <table class="table history-table">

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>Name</th>

                                <th>Mobile</th>

                                <th>Amount</th>

                                <th>Status</th>

                                <th>Date</th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="historyTable">

                            <tr>

                                <td colspan="7"
                                    class="text-center">

                                    <i class="bi bi-inbox empty-icon"></i>

                                    No Orders Found

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>



    <!-- ================= FOOTER ================= -->

    <div class="history-footer">

        ⚡ Shree Electrical Service
        <br>

        Order Management System © 2026

    </div>



    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Firebase -->

    <script type="module" src="js/firebase.js"></script>


    <!-- History JS -->

    <script type="module" src="js/history.js"></script>
    <script src="js/messages.js"></script>


</body>

</html>
